<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>微信小游戏适配 · 本地验证</title>
<style>html,body{margin:0;background:#081820;color:#d5e6df;font:15px system-ui}main{display:flex;gap:32px;padding:20px;justify-content:center}#device{width:292.5px;height:633px;background:#0c1c25;border:1px solid #516c70;border-radius:20px;overflow:hidden;position:relative;touch-action:none}#device>canvas{width:100%;height:100%;display:block}#capsule{position:absolute;right:10px;top:34px;border:1px solid #78939377;border-radius:20px;padding:2px 12px;color:#bcd5cb;pointer-events:none}aside{width:300px;line-height:1.65}button,a{border:1px solid #78958f;border-radius:9px;background:#25414b;color:#dbede8;padding:12px;margin:5px 6px 5px 0;display:inline-block}pre{white-space:pre-wrap;background:#172f39;border-radius:12px;padding:16px;font-size:13px}h1{font-size:23px;color:#ffce8c}canvas#icon{width:128px;height:128px;border-radius:25px}</style>
<main><div id="device"><span id="capsule">··· │ ○</span></div><aside><h1>微信小游戏适配验证</h1><p>浏览器模拟 wx 接口，仅验证适配层。<br>尚未连接微信开发者工具或真机。</p><p>A / D 移动，J 攻击，空格跳跃。<br>也可直接点击画面中的按钮。</p><button id="hide">模拟切到后台</button><button id="show">模拟回到前台</button><pre id="status">正在启动</pre><canvas id="icon" width="512" height="512"></canvas><br><a id="download">下载游戏图标</a></aside></main>
<script>var module={exports:{}};</script><script src="../dist/wechat-minigame/core.js"></script><script>var createCore=module.exports;module={exports:{}};</script><script src="../dist/wechat-minigame/native-audio.js"></script><script>var createNativeAudioClass=module.exports;module={exports:{}};var require=name=>{if(name==='./native-audio')return createNativeAudioClass;throw Error(name);};</script><script src="../dist/wechat-minigame/runtime.js"></script>
<script>
const createRuntime=module.exports,callbacks={},device=document.querySelector('#device');let canvasCount=0;
const api={
 createCanvas(){const c=document.createElement('canvas');if(canvasCount++===0)device.prepend(c);return c;},
 getWindowInfo:()=>({windowWidth:390,windowHeight:844,pixelRatio:2,safeArea:{left:0,right:390,top:47,bottom:810}}),getMenuButtonBoundingClientRect:()=>({bottom:80}),
 getPerformance:()=>({now:()=>performance.now()*1000}),getStorageSync:key=>localStorage.getItem(key),setStorageSync:(key,value)=>localStorage.setItem(key,value),createWebAudioContext:()=>new AudioContext()
};
for(const event of ['TouchStart','TouchMove','TouchEnd','TouchCancel','KeyDown','KeyUp','Hide','Show','WindowResize','AudioInterruptionBegin']){api['on'+event]=fn=>callbacks[event]=fn;api['off'+event]=()=>delete callbacks[event];}
const runtime=createRuntime(api,{requestAnimationFrame:fn=>requestAnimationFrame(fn),cancelAnimationFrame:id=>cancelAnimationFrame(id)},createCore);runtime.start();
const screen=runtime.screen;screen.tabIndex=0;
for(const [name,event] of [['pointerdown','TouchStart'],['pointermove','TouchMove'],['pointerup','TouchEnd'],['pointercancel','TouchCancel']]) screen.addEventListener(name,e=>{if(name==='pointerdown'){screen.focus();screen.setPointerCapture(e.pointerId);}e.preventDefault();const b=screen.getBoundingClientRect();callbacks[event]({changedTouches:[{identifier:e.pointerId,clientX:(e.clientX-b.left)*390/b.width,clientY:(e.clientY-b.top)*844/b.height}]});});
window.addEventListener('keydown',e=>{if(!e.target.closest('button')){e.preventDefault();callbacks.KeyDown(e);}});window.addEventListener('keyup',e=>callbacks.KeyUp(e));
document.querySelector('#hide').onclick=()=>callbacks.Hide();document.querySelector('#show').onclick=()=>callbacks.Show();
setInterval(()=>{const game=runtime.game,loop=game.audio.movementLoop;document.querySelector('#status').textContent=JSON.stringify({state:game.state,heroX:Math.round(game.player.x),audio:game.audio.ctx?.state||'未启用',movementLoop:loop?.level||0,held:Object.keys(game.input.down).filter(k=>game.input.down[k]),floor:game.floorIndex+1},null,2);},150);
const canvas=document.querySelector('#icon'),c=canvas.getContext('2d');
const env={window:{},document:{},performance:{now:()=>0},requestAnimationFrame:()=>{}};createCore(env);const art=env.window.GameArt;
c.fillStyle='#17323e';c.fillRect(0,0,512,512);const glow=c.createRadialGradient(256,180,10,256,230,320);glow.addColorStop(0,'#648680');glow.addColorStop(1,'#15313d');c.fillStyle=glow;c.fillRect(0,0,512,512);
art.character(c,{x:232,y:292,w:34,h:58,dir:1,animTime:0,onGround:true,walkCycle:0},{x:0,y:0},{scale:3.8,portrait:true});
art.text(c,'社畜反击战',256,454,53,'#ffcb87',900,'center');art.text(c,'AFTER HOURS',256,490,17,'#b6d9cb',600,'center');
const link=document.querySelector('#download');link.download='shechu-wechat-icon.png';link.href=canvas.toDataURL('image/png');
</script></html>
